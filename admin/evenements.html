<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REFC — Événements littéraires (Admin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        .banniere-demo {
            background: #1e3a5f;
            color: #93c5fd;
            text-align: center;
            padding: 8px 16px;
            font-size: 12px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 999;
        }
        .banniere-demo a { color: #60a5fa; text-decoration: none; }
        .topbar {
            background: #2D3F7B;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 36px;
        }
        .topbar-logo { display: flex; align-items: center; gap: 12px; }
        .topbar-logo img { height: 32px; }
        .topbar-titre { font-size: 14px; font-weight: 500; opacity: 0.9; }
        .topbar-droite { display: flex; align-items: center; gap: 16px; font-size: 13px; }
        .pill-role {
            background: rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .btn-deconnexion {
            background: none;
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-deconnexion:hover { background: rgba(255,255,255,0.1); }
        .nav {
            background: #253570;
            display: flex;
            padding: 0 24px;
            gap: 2px;
            overflow-x: auto;
        }
        .nav-btn {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            padding: 10px 16px;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover { color: #fff; }
        .nav-btn.actif {
            color: #fff;
            border-bottom-color: #7B9EC8;
            background: rgba(255,255,255,0.08);
        }
        .contenu {
            padding: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .entete-page {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-titre { font-size: 22px; font-weight: 600; }
        .btn {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn:hover { background: #f8fafc; }
        .btn-primaire { background: #2D3F7B; color: #fff; border-color: #2D3F7B; }
        .btn-primaire:hover { background: #253570; }
        .btn-danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .btn-danger:hover { background: #fecaca; }
        .btn-succes { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .btn-succes:hover { background: #bbf7d0; }
        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .kpi {
            background: #fff;
            border-radius: 10px;
            padding: 16px 18px;
            border: 1px solid #e2e8f0;
        }
        .kpi-label { font-size: 12px; color: #64748b; margin-bottom: 6px; }
        .kpi-valeur { font-size: 24px; font-weight: 600; color: #1e293b; }
        .kpi-valeur.vert { color: #166534; }
        .kpi-valeur.orange { color: #854d0e; }
        .kpi-valeur.rouge { color: #991b1b; }
        .section-titre {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 10px;
        }
        .tableau-wrap {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            padding: 10px 14px;
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }
        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .badge-vert { background: #dcfce7; color: #166534; }
        .badge-orange { background: #fef9c3; color: #854d0e; }
        .badge-rouge { background: #fee2e2; color: #991b1b; }
        .badge-bleu { background: #E8EEF7; color: #2D3F7B; }
        .badge-gris { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
        .badge-bleu { background: #f3e8ff; color: #6b21a8; }

        /* Détail événement */
        .detail-card {
            display: none;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .detail-card.visible { display: block; }
        .detail-header {
            background: #2D3F7B;
            color: #fff;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .detail-header-titre { font-size: 15px; font-weight: 500; }
        .detail-header-droite { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .onglets {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            overflow-x: auto;
        }
        .onglet-btn {
            padding: 10px 18px;
            font-size: 13px;
            border: none;
            background: none;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            white-space: nowrap;
        }
        .onglet-btn:hover { color: #1e293b; }
        .onglet-btn.actif {
            color: #2D3F7B;
            border-bottom-color: #2D3F7B;
            font-weight: 500;
        }
        .onglet-contenu { display: none; padding: 18px; }
        .onglet-contenu.visible { display: block; }
        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .mini-kpi {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .mini-kpi-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .mini-kpi-valeur { font-size: 18px; font-weight: 600; }
        .mini-kpi-valeur.vert { color: #166534; }
        .mini-kpi-valeur.orange { color: #854d0e; }
        .sep { height: 1px; background: #e2e8f0; margin: 16px 0; }
        .note-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #1d4ed8;
            margin-bottom: 14px;
        }
        .note-warn {
            background: #fef9c3;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #854d0e;
            margin-bottom: 14px;
        }

        /* Bloc auteur dans la vue admin */
        .auteur-bloc {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .auteur-titre {
            font-size: 14px;
            font-weight: 600;
            color: #2D3F7B;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sous-bloc {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .sous-bloc-titre {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .champ-ligne {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }
        .champ-ligne:last-child { border-bottom: none; }
        .champ-cle { color: #64748b; }
        .champ-val { color: #1e293b; font-weight: 500; }
        .champ-val.calcule { color: #2D3F7B; }
        .champ-val.total { color: #166534; font-size: 14px; }
        .input-admin {
            padding: 4px 10px;
            font-size: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            color: #1e293b;
            background: #fff;
            width: 120px;
            text-align: right;
        }
        .input-admin:focus {
            border-color: #2D3F7B;
            box-shadow: 0 0 0 3px rgba(45,63,123,0.1);
        }
        .select-admin {
            padding: 4px 10px;
            font-size: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            color: #1e293b;
            background: #fff;
            cursor: pointer;
        }
        .actions-groupe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

        /* Modal */
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-bg.visible { display: flex; }
        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            width: 460px;
            max-width: 95vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-confirm {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            width: 400px;
            max-width: 95vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-titre {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-fermer {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
</head>
<body>

    <!-- Bannière démo -->
    <div class="banniere-demo">
        ⚠️ <strong>DÉMONSTRATION</strong> — Données entièrement fictives ·

    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-logo">

        </div>
        <div class="topbar-droite">
            <span class="pill-role">admin</span>

            <button class="btn-deconnexion"
                onclick="window.location.href='../index.html'">

            </button>

    <!-- Navigation -->
    <div class="nav">
        <a class="nav-btn" href="tableau-de-bord.html">Accueil</a>

        <a class="nav-btn" href="bulletins.html">Bulletins</a>
        <a class="nav-btn" href="ingram.html">Ingram</a>
    </div>

    <!-- Contenu -->
    <div class="contenu">

        <div class="entete-page">
            <h1 class="page-titre">Événements littéraires — 2025–2026</h1>
            <div style="display:flex;gap:8px">
                <button class="btn">↓ Exporter suivi annuel</button>
            </div>
        </div>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi">
                <div class="kpi-label">Demandes reçues</div>
                <div class="kpi-valeur">8</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">En attente d'approbation</div>
                <div class="kpi-valeur">3</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">Approuvés</div>
                <div class="kpi-valeur">4</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">Budget utilisé</div>
                <div class="kpi-valeur rouge">8 450,00 $</div>
            </div>
        </div>

        <!-- Tableau des demandes -->
        <div class="section-titre">Demandes d'événements</div>
        <div class="tableau-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Activité</th>
                        <th style="width:80px">Date</th>
                        <th style="width:100px">Maison</th>
                        <th style="width:70px">Lieu</th>
                        <th style="width:75px">Auteurices</th>
                        <th style="width:90px">Budget estimé</th>
                        <th style="width:90px">Statut</th>
                        <th style="width:100px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Lecture publique — Bibliothèque de Hearst</strong></td>
                        <td>15 mars 2026</td>
                        <td>Prise de Parole</td>
                        <td>Hearst, ON</td>
                        <td>2</td>
                        <td>2 318,75 $</td>
                        <td><span class="badge badge-vert">Approuvé</span></td>
                        <td>
                            <div style="display:flex;gap:4px">
                                <button class="btn"
                                    style="padding:4px 8px;font-size:11px"
                                    onclick="afficherDetail('hearst')">
                                    Voir
                                </button>
                                <button class="btn"
                                    style="padding:4px 8px;font-size:11px">
                                    ↓ Excel
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Animation — Librairie du Soleil</strong></td>
                        <td>2 avril 2026</td>
                        <td>David</td>
                        <td>Ottawa, ON</td>
                        <td>1</td>
                        <td>1 875,00 $</td>
                        <td><span class="badge badge-orange">En attente</span></td>
                        <td>
                            <div style="display:flex;gap:4px">
                                <button class="btn"
                                    style="padding:4px 8px;font-size:11px"
                                    onclick="afficherDetail('soleil')">
                                    Traiter
                                </button>
                                <button class="btn btn-danger"
                                    style="padding:4px 8px;font-size:11px"
                                    onclick="confirmerSuppression('Animation — Librairie du Soleil')">
                                    ✕
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Table ronde — École secondaire Béatrice-Desloges</strong></td>
                        <td>20 avril 2026</td>
                        <td>L'Interligne</td>
                        <td>Ottawa, ON</td>
                        <td>3</td>
                        <td>3 200,00 $</td>
                        <td><span class="badge badge-orange">En attente</span></td>
                        <td>
                            <div style="display:flex;gap:4px">
                                <button class="btn"
                                    style="padding:4px 8px;font-size:11px">
                                    Traiter
                                </button>
                                <button class="btn btn-danger"
                                    style="padding:4px 8px;font-size:11px"
                                    onclick="confirmerSuppression('Table ronde — École Béatrice-Desloges')">
                                    ✕
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Détail Hearst (approuvé) -->
        <div class="detail-card" id="detail-hearst">
            <div class="detail-header">
                <span class="detail-header-titre">
                    Lecture publique — Bibliothèque de Hearst
                </span>
                <div class="detail-header-droite">
                    <span class="badge badge-vert">Approuvé</span>
                    <button class="btn"
                        style="padding:4px 10px;font-size:12px;
                        background:rgba(255,255,255,0.15);
                        border-color:rgba(255,255,255,0.3);color:#fff"
                        onclick="fermerDetail('hearst')">
                        Fermer ✕
                    </button>
                </div>
            </div>

            <div class="onglets">
                <button class="onglet-btn actif"
                    onclick="changerOnglet('hearst','infos',this)">
                    Informations
                </button>
                <button class="onglet-btn"
                    onclick="changerOnglet('hearst','auteurs',this)">
                    Auteurices (2)
                </button>
                <button class="onglet-btn"
                    onclick="changerOnglet('hearst','promo',this)">
                    Promotion
                </button>
                <button class="onglet-btn"
                    onclick="changerOnglet('hearst','budget',this)">
                    Budget total
                </button>
            </div>

            <!-- Onglet Informations -->
            <div class="onglet-contenu visible" id="hearst-infos">
                <div class="grid2">
                    <div>
                        <div class="sous-bloc">
                            <div class="sous-bloc-titre">Informations générales</div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Nom de l'activité</span>
                                <span class="champ-val">Lecture publique</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Date</span>
                                <span class="champ-val">15 mars 2026</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Lieu</span>
                                <span class="champ-val">Bibliothèque municipale</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Ville, Province</span>
                                <span class="champ-val">Hearst, Ontario</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Responsable</span>
                                <span class="champ-val">Noureddine Hany</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Maison membre</span>
                                <span class="champ-val">Prise de Parole</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="sous-bloc">
                            <div class="sous-bloc-titre">Approbation</div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Statut</span>
                                <span class="champ-val">
                                    <span class="badge badge-vert">Approuvé</span>
                                </span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Approuvé par</span>
                                <span class="champ-val">Piedad Saenz</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Date d'approbation</span>
                                <span class="champ-val">28 février 2026</span>
                            </div>
                            <div class="champ-ligne">
                                <span class="champ-cle">Budget approuvé</span>
                                <span class="champ-val" style="color:#2D3F7B;font-weight:600">
                                    2 318,75 $
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="actions-groupe">
                    <button class="btn btn-primaire" onclick="genererExcel('hearst')">↓ Générer rapport Excel</button>
                    <button class="btn">📄 Voir la demande originale</button>
                </div>
            </div>

            <!-- Onglet Auteurices -->
            <div class="onglet-contenu" id="hearst-auteurs">

                <!-- Auteur 1 -->
                <div class="auteur-bloc">
                    <div class="auteur-titre">
                        <span>Auteure 1 — Véronique Sylvain</span>
                        <span class="badge badge-bleu">Poésie</span>
                    </div>

                    <div class="champ-ligne" style="margin-bottom:10px">
                        <span class="champ-cle">Ville de résidence</span>
                        <span class="champ-val">Ottawa, Ontario</span>
                    </div>
                    <div class="champ-ligne" style="margin-bottom:14px">
                        <span class="champ-cle">Distance (calculée auto)</span>
                        <span class="champ-val calcule">612 km</span>
                    </div>

                    <div class="sous-bloc">
                        <div class="sous-bloc-titre">Voyage (A/R)</div>
                        <div class="champ-ligne">
                            <span class="champ-cle">Mode de transport</span>
                            <span class="champ-val">Voiture personnelle</span>
                        </div>
                        <div class="champ-ligne">
                            <span class="champ-cle">Frais à engager</span>
                            <span class="champ-val">180,00 $</span>
                        </div>
                        <div class="champ-ligne">
                            <span class="champ-cle">Autres dépenses (Uber, stationnement...)</span>

        function afficherDetail(id) {
            document.querySelectorAll('.detail-card').forEach(d => {
                d.classList.remove('visible');

            const cible = document.getElementById('detail-' + id);
            cible.classList.add('visible');
            cible.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function fermerDetail(id) {
            document.getElementById('detail-' + id).classList.remove('visible');
        }

        function changerOnglet(section, onglet, btn) {
            const detail = document.getElementById('detail-' + section);
            detail.querySelectorAll('.onglet-btn').forEach(b => {
                b.classList.remove('actif');
            });
            detail.querySelectorAll('.onglet-contenu').forEach(c => {
                c.classList.remove('visible');
            });
            if (btn) btn.classList.add('actif');
            const el = document.getElementById(section + '-' + onglet);
            if (el) el.classList.add('visible');
        }

            document.getElementById(id).classList.add('visible');

            document.getElementById(id).classList.remove('visible');

            document.getElementById('texte-suppression').innerHTML =

        // ============================================================

        function genererExcel(evenement) {

            const wb = XLSX.utils.book_new();

            // Données selon l'événement
            const data = getDataEvenement(evenement);

            // Construire les lignes de la feuille
            const rows = [];

            // En-tête REFC
            rows.push(['REGROUPEMENT DES ÉDITEURS FRANCO-CANADIENS (REFC)', '', '', '']);
            rows.push(['RAPPORT D'ACTIVITÉ LITTÉRAIRE', '', '', '']);
            rows.push(['', '', '', '']);

            // Informations générales
            rows.push(['INFORMATIONS GÉNÉRALES', '', '', '']);
            rows.push(['Nom de l'activité', data.nom, '', '']);
            rows.push(['Date', data.date, '', '']);
            rows.push(['Lieu', data.lieu, '', '']);
            rows.push(['Ville, Province', data.ville, '', '']);
            rows.push(['Responsable', data.responsable, '', '']);
            rows.push(['Maison membre', data.maison, '', '']);
            rows.push(['Statut', data.statut, '', '']);
            rows.push(['Approuvé par', data.approuve_par, '', '']);
            rows.push(['Date d'approbation', data.date_approbation, '', '']);
            rows.push(['', '', '', '']);

            // Auteurices
            rows.push(['AUTEURICES / PARTICIPANTS', '', '', '']);
            rows.push(['', '', '', '']);

            data.auteurs.forEach((auteur, i) => {
                rows.push([`Auteur·ice ${i + 1} — ${auteur.nom}`, '', '', '']);
                rows.push(['Genre littéraire', auteur.genre, '', '']);
                rows.push(['Ville de résidence', auteur.ville, '', '']);
                rows.push(['Distance (calculée)', auteur.distance, '', '']);
                rows.push(['', '', '', '']);

                rows.push(['VOYAGE (A/R)', '', '', '']);
                rows.push(['Mode de transport', auteur.transport, '', '']);
                rows.push(['Frais à engager', '', auteur.frais_transport, '$']);
                rows.push(['Autres dépenses (Uber, stationnement...)', '', auteur.autres_depenses, '$']);
                rows.push(['Prise en charge REFC', auteur.prise_charge_voyage, '', '']);
                rows.push(['Total Voyage', '', auteur.total_voyage, '$']);
                rows.push(['', '', '', '']);

                if (auteur.nuitees > 0) {
                    rows.push(['SÉJOUR', '', '', '']);
                    rows.push(['Nombre de nuitées', auteur.nuitees, '', '']);
                    rows.push(['Montant moyen / nuit', '', auteur.montant_nuit, '$']);
                    rows.push(['Prise en charge REFC', auteur.prise_charge_sejour, '', '']);
                    rows.push(['Sous-total hébergement', '', auteur.sous_total_hebergement, '$']);
                    rows.push(['Per diem base / jour', '', auteur.perdiem_base, '$']);
                    if (auteur.deductions && auteur.deductions.length > 0) {
                        auteur.deductions.forEach(d => {
                            rows.push([`  Déduction — ${d.nom}`, '', -d.montant, '$']);
                        });
                    }
                    rows.push(['Per diem net / jour', '', auteur.perdiem_net, '$']);
                    rows.push([`Per diem total (${auteur.nuitees} nuit${auteur.nuitees > 1 ? 's' : ''})`, '', auteur.perdiem_total, '$']);
                    rows.push(['Total Séjour', '', auteur.total_sejour, '$']);
                    rows.push(['', '', '', '']);
                }

                rows.push(['DÉROULEMENT DE L'ACTIVITÉ', '', '', '']);
                rows.push(['Déplacement sur place (A/R)', '', auteur.deplacement_place, '$']);
                rows.push(['Cachet auteur·ice', '', auteur.cachet, '$']);
                rows.push(['Total Déroulement', '', auteur.total_deroulement, '$']);
                rows.push(['', '', '', '']);
                rows.push([`BUDGET TOTAL — ${auteur.nom}`, '', auteur.budget_total, '$']);
                rows.push(['', '', '', '']);
                rows.push(['', '', '', '']);
            });

            // Promotion
            rows.push(['PROMOTION — COMMUNICATION (REFC)', '', '', '']);
            rows.push(['Frais de promotion (graphisme, publicité, affiches...)', '', data.promo.graphisme, '$']);
            rows.push(['Consommation (verre d'amitié, cocktail...)', '', data.promo.consommation, '$']);
            rows.push(['Cachet animateur·rice / Panélistes', '', data.promo.cachet_animateur, '$']);
            rows.push(['Contribution REFC à l'aménagement', '', data.promo.amenagement, '$']);
            rows.push(['Budget Promotion-Communication', '', data.promo.total, '$']);
            rows.push(['', '', '', '']);

            // Récapitulatif financier
            rows.push(['RÉCAPITULATIF FINANCIER', '', '', '']);
            data.auteurs.forEach(auteur => {
                rows.push([auteur.nom, '', auteur.budget_total, '$']);
            });
            rows.push(['Budget Promotion-Communication', '', data.promo.total, '$']);
            rows.push(['', '', '', '']);
            rows.push(['BUDGET TOTAL DE L'ACTIVITÉ', '', data.budget_total, '$']);
            rows.push(['Prise en charge REFC', '', data.prise_charge_refc, '$']);
            rows.push(['Part maison membre', '', data.part_maison, '$']);
            rows.push(['', '', '', '']);
            rows.push(['Approuvé par', data.approuve_par, '', '']);
            rows.push(['Date d'approbation', data.date_approbation, '', '']);

            // Créer la feuille
            const ws = XLSX.utils.aoa_to_sheet(rows);

            // Largeurs des colonnes
            ws['!cols'] = [
                { wch: 48 },
                { wch: 28 },
                { wch: 18 },
                { wch: 8  }
            ];

            // Styles de base (fusion titre)
            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 3 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } },
            ];

            XLSX.utils.book_append_sheet(wb, ws, 'Rapport');

            // Télécharger
            const nomFichier = `rapport_evenement_${data.nom.toLowerCase()
                .replace(/[^a-z0-9]/g, '_')
                .replace(/_+/g, '_')
                .substring(0, 40)}_${data.date.replace(/-/g, '')}.xlsx`;

            XLSX.writeFile(wb, nomFichier);
        }
