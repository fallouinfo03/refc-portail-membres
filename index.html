<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REFC — Connexion</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .carte-connexion {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .entete {
            text-align: center;
            margin-bottom: 28px;
        }

        .entete img {
            width: 200px;
            margin-bottom: 8px;
        }

        .separateur {
            height: 1px;
            background-color: #e2e8f0;
            margin: 20px 0;
        }

        .titre-connexion {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 24px;
            text-align: center;
        }

        .champ {
            margin-bottom: 16px;
        }

        .champ label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }

        .champ input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            color: #1e293b;
        }

        .champ input:focus {
            border-color: #2D3F7B;
            box-shadow: 0 0 0 3px rgba(45, 63, 123, 0.1);
        }

        /* Message d'erreur — caché par défaut */
        .message-erreur {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none; /* caché jusqu'à ce qu'il y ait une erreur */
        }

        .bouton-connexion {
            width: 100%;
            padding: 12px;
            background-color: #2D3F7B;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .bouton-connexion:hover {
            background-color: #253570;
        }

        .bouton-connexion:active {
            background-color: #1e2a5e;
        }

        .lien-oubli {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 12.5px;
            color: #2D3F7B;
            text-decoration: none;
        }

        .lien-oubli:hover {
            text-decoration: underline;
        }

        .pied {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #94a3b8;
        }

    </style>
</head>
<body>

    <div class="carte-connexion">

        <div class="entete">
            <img src="assets/logo-refc.png" alt="REFC — Regroupement des éditeurs franco-canadiens">
        </div>

        <div class="separateur"></div>

        <h2 class="titre-connexion">Connexion à l'espace membres</h2>

        <!-- Message d'erreur (affiché par JavaScript si besoin) -->
        <div class="message-erreur" id="message-erreur">
            Identifiant ou mot de passe invalide.
        </div>

        <form id="formulaire-connexion" onsubmit="verifierConnexion(event)">

            <div class="champ">
                <label for="identifiant">Identifiant</label>
                <input 
                    type="text" 
                    id="identifiant" 
                    placeholder="Votre identifiant"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="champ">
                <label for="motdepasse">Mot de passe</label>
                <input 
                    type="password" 
                    id="motdepasse" 
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="bouton-connexion">
                Se connecter
            </button>

        </form>

        <a href="#" class="lien-oubli">Mot de passe oublié ?</a>

        <div class="pied">
            © 2026 REFC — Tous droits réservés
        </div>

    </div>

    <script>
        /*
         * SIMULATION DE CONNEXION (démo uniquement)
         * Dans le vrai portail, cette vérification se fait côté serveur.
         * Jamais stocker de vrais mots de passe dans le JavaScript !
         */
        const COMPTES_DEMO = [
            { identifiant: "admin", motdepasse: "refc2026", role: "admin" },
            { identifiant: "prisedeparole", motdepasse: "demo2026", role: "membre" },
            { identifiant: "david", motdepasse: "demo2026", role: "membre" }
        ];

        function verifierConnexion(event) {
            // Empêcher le rechargement de la page
            event.preventDefault();

            const identifiant = document.getElementById('identifiant').value.trim();
            const motdepasse = document.getElementById('motdepasse').value;
            const messageErreur = document.getElementById('message-erreur');

            // Cacher l'erreur précédente
            messageErreur.style.display = 'none';

            // Vérifier les champs vides
            if (!identifiant || !motdepasse) {
                messageErreur.textContent = 'Veuillez remplir tous les champs.';
                messageErreur.style.display = 'block';
                return;
            }

            // Chercher le compte correspondant
            const compte = COMPTES_DEMO.find(
                c => c.identifiant === identifiant && c.motdepasse === motdepasse
            );

            if (compte) {
                // Connexion réussie — rediriger selon le rôle
                if (compte.role === 'admin') {
                    window.location.href = 'admin/tableau-de-bord.html';
                } else {
                    window.location.href = 'membre/tableau-de-bord.html';
                }
            } else {
                // Connexion échouée — message générique (ne révèle pas si c'est l'identifiant ou le mot de passe)
                messageErreur.textContent = 'Identifiant ou mot de passe invalide.';
                messageErreur.style.display = 'block';
            }
        }
    </script>

</body>
</html>
